<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Check whether a final proposal visibly names every issued addendum."
    />
    <title>Addendum Echo</title>
  </head>
  <body>
    <main class="shell">
      <section class="task" aria-labelledby="page-title">
        <div class="eyebrow" aria-hidden="true">ADDENDUM ECHO</div>
        <h1 id="page-title">Did the final proposal name every addendum?</h1>
        <p class="intro">
          Drop the issued addenda and final proposal. Your files stay in this
          browser.
        </p>

        <label class="drop-zone" id="drop-zone" for="file-input">
          <input
            id="file-input"
            type="file"
            accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown"
            multiple
          />
          <span class="drop-icon" aria-hidden="true">↓</span>
          <span class="drop-title">Drop PDF or text files here</span>
          <span class="drop-note">or tap to choose files</span>
        </label>

        <div class="selection" id="selection" aria-live="polite">
          Add issued addenda plus one final proposal.
        </div>

        <button
          id="check-button"
          class="primary-action"
          data-primary-action
          disabled
        >
          Check the proposal
        </button>

        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div id="result" class="result" aria-live="polite" hidden></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
